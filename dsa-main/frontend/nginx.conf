server {
    listen 80;
    listen [::]:80;
    server_name DSA-Management.com;  

    root /usr/share/nginx/html;
    index index.html index.htm;

    # --- Kompresja ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # --- Nagłówki bezpieczeństwa ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Produkcyjny CSP 
    add_header Content-Security-Policy "
        default-src 'self';
        base-uri 'self';
        script-src 'self' https://cdn.DSA-Management.com; 
        style-src 'self' 'unsafe-inline' https://cdn.DSA-Management.com;
        img-src 'self' data: blob:;
        font-src 'self' https://cdn.DSA-Management.com;
        connect-src 'self' https://api.DSA-Management.com;
        frame-ancestors 'self';
        object-src 'none';
        upgrade-insecure-requests
    " always;

    # (HTTPS) HSTS – włącz TYLKO na HTTPS:

    # --- Cache statycznych assetów  ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- HTML: brak cache ---
    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Health ---
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}

